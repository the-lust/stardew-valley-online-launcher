name: lobby-prune
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prune stale lobbies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python server/prune.py
